<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Cognitiva y Entrenamiento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #334155;
    }

    h1, h2, h3 {
      color: #38bdf8;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    input, select {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }

    button {
      background-color: #38bdf8;
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #0284c7;
      color: #fff;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
      padding: 10px;
      border-radius: 5px;
      background: #0f172a;
    }

    /* Juego de Memoria */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 80px);
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }

    .pad {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      border: none;
      opacity: 0.5;
      cursor: pointer;
    }

    .pad-0 { background: #ef4444; }
    .pad-1 { background: #3b82f6; }
    .pad-2 { background: #10b981; }
    .pad-3 { background: #f59e0b; }

    .active {
      opacity: 1 !important;
      transform: scale(0.95);
    }
